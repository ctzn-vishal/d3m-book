# §5.3 — Nightly registry snapshot sync.
#
# Curation happens in the live Turso `gallery` table (via /admin). The committed
# fallback content/registry.snapshot.json only refreshes when `sync-registry` runs
# + the result is committed. This job does that nightly so the fallback never
# drifts far from live. Edits still show on the site within the ISR window (or
# instantly via /api/revalidate); this only keeps the *committed* copy fresh.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   TURSO_DATABASE_URL, TURSO_AUTH_TOKEN  (a DB-scoped or platform token),
#   TIGRIS_ENDPOINT, TIGRIS_CLIENT_ID, TIGRIS_CLIENT_SECRET, AWS_REGION
# Note: pnpm scripts hardcode `--env-file=../.env` (absent in CI), so this runs the
# underlying node script directly with env from secrets instead.
name: Nightly registry snapshot sync

on:
  schedule:
    - cron: '17 7 * * *' # 07:17 UTC daily
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json's `packageManager` — action-setup
      # errors if both specify one (this had failed every nightly since 06-23).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Load secrets into the job env, stripping stray CR/LF/whitespace from
      # copy-pasted values, and fail fast (with names) when any are missing.
      - name: Load + sanitize secrets
        env:
          RAW_TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          RAW_TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          RAW_TIGRIS_ENDPOINT: ${{ secrets.TIGRIS_ENDPOINT }}
          RAW_TIGRIS_CLIENT_ID: ${{ secrets.TIGRIS_CLIENT_ID }}
          RAW_TIGRIS_CLIENT_SECRET: ${{ secrets.TIGRIS_CLIENT_SECRET }}
          RAW_AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          missing=""
          for v in TURSO_DATABASE_URL TURSO_AUTH_TOKEN TIGRIS_ENDPOINT TIGRIS_CLIENT_ID TIGRIS_CLIENT_SECRET AWS_REGION; do
            raw="RAW_$v"
            val="$(printf '%s' "${!raw}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -z "$val" ] && [ "$v" != "AWS_REGION" ] && missing="$missing $v"
            echo "$v=$val" >> "$GITHUB_ENV"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing — add them under Settings → Secrets and variables → Actions → Repository secrets (values are in book-template/.env.local)."
            exit 1
          fi
          echo "All required secrets present (sanitized)."
      - name: Sync registry snapshot from Turso
        run: node --import tsx scripts/sync-registry.ts
      - name: Commit snapshot if changed
        run: |
          # Ignore the date-only `generated` line so a no-content-change night
          # doesn't produce a noise commit (and a needless Vercel rebuild).
          if git diff --quiet -I '"generated"' -- content/registry.snapshot.json; then
            echo "Snapshot unchanged (ignoring generated date) — nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/registry.snapshot.json
            git commit -m "chore: nightly registry snapshot sync"
            git push
          fi
