# Full content-publish pipeline — nightly, plus on demand (Actions → run workflow).
# Mirrors `pnpm publish-content` but with env from repo secrets, so new bucket
# uploads are ingested without a dev machine:
#   rebuild-manifest → sync-registry → [gen-thumbnails → rebuild+sync again]
#   → inject-chrome → gen-story-sitemap (+robots.txt) → verify-content
#   → commit the refreshed snapshot (which triggers the Vercel deploy).
#
# WHY NIGHTLY: this is the ONLY job that reads the bucket. Dropping <slug>.html
# into vishal/articles/ does nothing until rebuild-manifest scans it, and when
# this workflow was dispatch-only that scan was easy to forget — uploads sat
# invisible for weeks while the nightly snapshot sync kept reporting success
# (it only copies Turso → the committed snapshot; it never lists the bucket).
#
# CONSEQUENCE OF NIGHTLY: rebuild-manifest ingests new stories as `published`
# (everything except the slugs in UNLISTED_ON_INGEST), so a file dropped in the
# bucket goes live on the gallery on the next run, before it has a topic or a
# description. That is the intended trade. To stage something instead, either add
# its slug to UNLISTED_ON_INGEST in scripts/pipeline-config.mjs before it lands,
# or set the row to `draft` in /admin — curated columns survive later rebuilds.
#
# Thumbnails default ON for scheduled runs and are a checkbox for manual ones: a
# headless Chromium screenshots each bucket story that has no thumbnail yet,
# uploads it, and the second rebuild+sync pass folds the new thumbs into the
# manifest/snapshot so inject-chrome writes og:image in the same run. Failures
# there don't abort the pipeline — stories just keep their typed placeholder
# cards until the next run.
#
# Required repo secrets (same set as sync-snapshot.yml):
#   TURSO_DATABASE_URL, TURSO_AUTH_TOKEN,
#   TIGRIS_ENDPOINT, TIGRIS_CLIENT_ID, TIGRIS_CLIENT_SECRET, AWS_REGION
name: Publish content pipeline

on:
  schedule:
    # 06:20 UTC daily — an hour ahead of sync-snapshot.yml (07:17 UTC) so this
    # heavier job lands its snapshot commit first and the lighter one usually
    # finds nothing to do. Both share the `content-pipeline` concurrency group,
    # so even if this overruns they serialize rather than racing on git push.
    - cron: '20 6 * * *'
  workflow_dispatch:
    inputs:
      thumbnails:
        description: 'Generate + upload missing thumbnails (headless Chromium)'
        type: boolean
        default: true

concurrency:
  group: content-pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json's `packageManager` — action-setup
      # errors if both specify one.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Load secrets into the job env, stripping stray CR/LF/whitespace that a
      # copy-paste can smuggle in (a trailing newline inside TIGRIS_CLIENT_ID
      # becomes an invalid S3 Authorization header). Also fails fast, with the
      # names, when a required secret is missing — otherwise the S3 client
      # falls back to a bogus AWS endpoint and dies with a cryptic ENOTFOUND.
      - name: Load + sanitize secrets
        env:
          RAW_TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          RAW_TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          RAW_TIGRIS_ENDPOINT: ${{ secrets.TIGRIS_ENDPOINT }}
          RAW_TIGRIS_CLIENT_ID: ${{ secrets.TIGRIS_CLIENT_ID }}
          RAW_TIGRIS_CLIENT_SECRET: ${{ secrets.TIGRIS_CLIENT_SECRET }}
          RAW_AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          missing=""
          for v in TURSO_DATABASE_URL TURSO_AUTH_TOKEN TIGRIS_ENDPOINT TIGRIS_CLIENT_ID TIGRIS_CLIENT_SECRET AWS_REGION; do
            raw="RAW_$v"
            val="$(printf '%s' "${!raw}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -z "$val" ] && [ "$v" != "AWS_REGION" ] && missing="$missing $v"
            echo "$v=$val" >> "$GITHUB_ENV"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing — add them under Settings → Secrets and variables → Actions → Repository secrets (values are in book-template/.env.local)."
            exit 1
          fi
          echo "All required secrets present (sanitized)."

      - name: Rebuild article manifest from bucket
        run: node scripts/rebuild-manifest.mjs

      - name: Sync registry (Turso + snapshot)
        run: node --import tsx scripts/sync-registry.ts

      - name: Install Chromium for thumbnails
        # `inputs` is empty on a schedule trigger, so a bare `inputs.thumbnails`
        # would be falsey and silently skip thumbnails on every nightly run.
        # Default ON unless a manual run unticked the box.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.thumbnails }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate + upload missing thumbnails
        # `inputs` is empty on a schedule trigger, so a bare `inputs.thumbnails`
        # would be falsey and silently skip thumbnails on every nightly run.
        # Default ON unless a manual run unticked the box.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.thumbnails }}
        continue-on-error: true
        timeout-minutes: 25
        run: UPLOAD=1 node scripts/gen-thumbnails.mjs

      - name: Fold new thumbnails into manifest + snapshot
        # `inputs` is empty on a schedule trigger, so a bare `inputs.thumbnails`
        # would be falsey and silently skip thumbnails on every nightly run.
        # Default ON unless a manual run unticked the box.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.thumbnails }}
        run: |
          node scripts/rebuild-manifest.mjs
          node --import tsx scripts/sync-registry.ts

      - name: Inject chrome (pill, OG, Article JSON-LD, related stories)
        run: node scripts/inject-chrome.mjs

      - name: Generate content sitemap + robots.txt
        run: node scripts/gen-story-sitemap.mjs

      - name: Verify content pipeline consistency
        run: node scripts/verify-content.mjs

      - name: Commit snapshot if changed
        run: |
          # Ignore the date-only `generated` line so a no-content-change run
          # doesn't produce a noise commit (and a needless Vercel rebuild).
          if git diff --quiet -I '"generated"' -- content/registry.snapshot.json; then
            echo "Snapshot unchanged (ignoring generated date) — nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/registry.snapshot.json
            git commit -m "chore: publish-content pipeline snapshot sync"
            # Now that this runs unattended, don't let a push lose to a commit
            # that landed since checkout (the nightly sync, or a human) — rebase
            # and retry once rather than failing the whole run at the last step.
            git push || {
              echo "Push rejected — rebasing onto origin/${GITHUB_REF_NAME} and retrying."
              git pull --rebase --autostash origin "$GITHUB_REF_NAME"
              git push
            }
          fi
