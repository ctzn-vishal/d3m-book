<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presidential Election Atlas - 1976-2024</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
:root {
  --bg: #f6f3ec;
  --panel: #fffdf8;
  --panel-2: #f0ebe0;
  --ink: #20242a;
  --muted: #676f78;
  --rule: #ddd5c8;
  --rule-strong: #bdb4a5;
  --dem: #2f7ebc;
  --dem-dark: #155c94;
  --rep: #d73027;
  --rep-dark: #a8151c;
  --other: #7b8794;
  --gold: #c7922c;
  --green: #287d67;
  --shadow: 0 12px 32px rgba(35, 31, 26, 0.08);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

button, select {
  font: inherit;
}

.page {
  width: min(1480px, 100%);
  margin: 0 auto;
  padding: 28px 32px 48px;
}

.masthead {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: end;
  gap: 28px;
  padding-bottom: 18px;
  border-bottom: 2px solid var(--ink);
}

.kicker,
.eyebrow,
.small-label {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
  text-transform: uppercase;
  letter-spacing: 0.16em;
}

.kicker {
  margin: 0 0 8px;
  color: var(--muted);
  font-size: 11px;
}

h1 {
  margin: 0;
  max-width: 780px;
  font-family: Fraunces, Georgia, serif;
  font-size: clamp(34px, 5vw, 64px);
  line-height: 0.98;
  letter-spacing: 0;
}

.deck {
  max-width: 460px;
  margin: 0;
  color: var(--muted);
  font-family: Fraunces, Georgia, serif;
  font-size: 17px;
  line-height: 1.35;
  text-align: right;
}

.controls {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 18px;
  align-items: center;
  padding: 16px 0;
  border-bottom: 1px solid var(--rule);
}

.year-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  min-width: 0;
}

.year-button {
  border: 1px solid var(--rule);
  background: var(--panel);
  color: var(--muted);
  min-width: 58px;
  height: 34px;
  padding: 0 8px;
  border-radius: 6px;
  cursor: pointer;
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 12px;
  font-weight: 600;
  transition: border-color 120ms ease, color 120ms ease, background 120ms ease;
}

.year-button:hover {
  border-color: var(--rule-strong);
  color: var(--ink);
}

.year-button.active {
  color: white;
  border-color: transparent;
}

.year-button.dem.active { background: var(--dem); }
.year-button.rep.active { background: var(--rep); }
.year-button.other.active { background: var(--other); }

.year-select {
  display: none;
  width: 100%;
  height: 38px;
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: var(--panel);
  color: var(--ink);
  padding: 0 10px;
}

.source-stamp {
  color: var(--muted);
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 11px;
  text-align: right;
}

.scoreboard {
  display: grid;
  grid-template-columns: minmax(230px, 0.8fr) minmax(320px, 1.35fr) minmax(230px, 0.8fr);
  gap: 18px;
  padding: 22px 0 18px;
}

.candidate-card,
.result-card,
.panel {
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 8px;
  box-shadow: var(--shadow);
}

.candidate-card {
  min-height: 250px;
  padding: 18px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 14px;
  position: relative;
  overflow: hidden;
}

.candidate-card::before {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: 5px;
  background: var(--other);
}

.candidate-card.dem::before { background: var(--dem); }
.candidate-card.rep::before { background: var(--rep); }

.candidate-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.candidate-name {
  margin: 0;
  font-family: Fraunces, Georgia, serif;
  font-size: 25px;
  line-height: 1.05;
}

.party-pill {
  border-radius: 999px;
  padding: 4px 8px;
  background: var(--panel-2);
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  white-space: nowrap;
}

.portrait-row {
  display: flex;
  align-items: center;
  gap: 16px;
}

.portrait {
  width: 106px;
  height: 106px;
  border-radius: 50%;
  object-fit: cover;
  filter: grayscale(20%);
  border: 4px solid var(--rule);
  background: var(--panel-2);
}

.candidate-card.dem .portrait { border-color: var(--dem); }
.candidate-card.rep .portrait { border-color: var(--rep); }

.candidate-metrics {
  display: grid;
  gap: 8px;
  min-width: 0;
}

.metric-value {
  display: block;
  font-family: Fraunces, Georgia, serif;
  font-size: 34px;
  font-weight: 700;
  line-height: 1;
}

.metric-caption {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: 12px;
}

.candidate-card.dem .metric-value { color: var(--dem-dark); }
.candidate-card.rep .metric-value { color: var(--rep-dark); }

.candidate-foot {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: var(--muted);
  font-size: 12px;
  border-top: 1px solid var(--rule);
  padding-top: 12px;
}

.result-card {
  padding: 18px;
  display: grid;
  align-content: center;
  gap: 15px;
}

.year-title {
  margin: 0;
  text-align: center;
  font-family: Fraunces, Georgia, serif;
  font-size: clamp(30px, 4vw, 48px);
  line-height: 1.02;
}

.headline {
  margin: 0 auto;
  max-width: 620px;
  text-align: center;
  color: var(--muted);
  font-size: 15px;
}

.bars {
  display: grid;
  gap: 10px;
}

.bar-label {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: var(--muted);
  font-size: 12px;
}

.stack {
  position: relative;
  display: flex;
  height: 28px;
  overflow: hidden;
  border: 1px solid var(--rule);
  background: var(--panel-2);
  border-radius: 5px;
}

.stack .seg {
  min-width: 0;
  height: 100%;
}

.stack .dem { background: var(--dem); }
.stack .rep { background: var(--rep); }
.stack .other { background: var(--other); }

.majority-marker {
  position: absolute;
  top: -5px;
  bottom: -5px;
  width: 2px;
  background: var(--ink);
  transform: translateX(-1px);
}

.method-note {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}

.dashboard-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(360px, 0.65fr);
  gap: 18px;
}

.panel {
  min-width: 0;
  padding: 17px;
}

.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 14px;
  margin-bottom: 12px;
}

.panel-title {
  margin: 0;
  font-family: Fraunces, Georgia, serif;
  font-size: 23px;
  line-height: 1.12;
}

.panel-subtitle,
.eyebrow,
.small-label {
  color: var(--muted);
  font-size: 11px;
}

.map-wrap {
  width: 100%;
  min-height: 430px;
}

svg {
  display: block;
  width: 100%;
  height: auto;
}

.hex {
  cursor: pointer;
  transition: opacity 120ms ease, stroke-width 120ms ease;
}

.hex:hover,
.state-shape:hover {
  opacity: 0.88;
}

.hex-label,
.hex-ev,
.state-label {
  pointer-events: none;
  text-anchor: middle;
  font-weight: 700;
}

.hex-label {
  font-size: 12px;
}

.hex-ev {
  font-size: 9px;
  opacity: 0.88;
}

.state-shape {
  cursor: pointer;
  transition: opacity 120ms ease, stroke-width 120ms ease;
}

.state-label {
  font-size: 9px;
  paint-order: stroke;
  stroke: rgba(255, 253, 248, 0.82);
  stroke-width: 2.5px;
  stroke-linejoin: round;
}

.map-header-tools {
  display: grid;
  justify-items: end;
  gap: 9px;
  min-width: 260px;
}

.map-mode-tabs {
  display: inline-flex;
  gap: 3px;
  padding: 3px;
  border: 1px solid var(--rule);
  border-radius: 7px;
  background: var(--panel-2);
}

.map-mode-button {
  height: 28px;
  min-width: 74px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
}

.map-mode-button:hover {
  color: var(--ink);
}

.map-mode-button.active {
  background: var(--ink);
  color: var(--panel);
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 11px;
}

.legend-gradient {
  flex: 1;
  height: 10px;
  border-radius: 999px;
  border: 1px solid var(--rule);
  background: linear-gradient(90deg, #a8151c 0%, #f2c4ad 35%, #f8f7f2 50%, #b7d6ea 65%, #155c94 100%);
}

.side-stack {
  display: grid;
  gap: 18px;
}

.state-detail {
  display: grid;
  gap: 12px;
}

.state-name {
  margin: 0;
  font-family: Fraunces, Georgia, serif;
  font-size: 28px;
  line-height: 1.05;
}

.state-meta {
  color: var(--muted);
  font-size: 13px;
}

.candidate-bars {
  display: grid;
  gap: 8px;
}

.candidate-bar-row {
  display: grid;
  grid-template-columns: minmax(92px, 0.9fr) minmax(120px, 1.2fr) 58px;
  gap: 9px;
  align-items: center;
  font-size: 12px;
}

.candidate-bar-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.candidate-bar-track {
  height: 9px;
  border-radius: 999px;
  background: var(--panel-2);
  overflow: hidden;
}

.candidate-bar-fill {
  height: 100%;
  border-radius: 999px;
  background: var(--other);
}

.battleground-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

.battleground-table th,
.battleground-table td {
  padding: 7px 4px;
  border-bottom: 1px solid var(--rule);
  text-align: left;
}

.battleground-table th {
  color: var(--muted);
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.battleground-table td:last-child,
.battleground-table th:last-child {
  text-align: right;
}

.wide-panel {
  grid-column: 1 / -1;
}

.lower-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 18px;
  margin-top: 18px;
}

.chart-frame {
  width: 100%;
  min-height: 250px;
}

.axis text {
  fill: var(--muted);
  font-size: 11px;
}

.axis path,
.axis line {
  stroke: var(--rule-strong);
}

.chart-note {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.source-panel {
  margin-top: 18px;
  background: transparent;
  box-shadow: none;
}

.source-panel p {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
}

.tooltip {
  position: fixed;
  z-index: 20;
  max-width: 250px;
  pointer-events: none;
  background: rgba(32, 36, 42, 0.96);
  color: white;
  border-radius: 6px;
  padding: 10px 11px;
  font-size: 12px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
  opacity: 0;
  transform: translate(-999px, -999px);
}

.tooltip strong {
  display: block;
  margin-bottom: 4px;
  font-size: 13px;
}

.loading {
  min-height: 520px;
  display: grid;
  place-items: center;
  color: var(--muted);
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

@media (max-width: 1120px) {
  .masthead,
  .scoreboard,
  .dashboard-grid,
  .lower-grid {
    grid-template-columns: 1fr;
  }

  .deck {
    max-width: 760px;
    text-align: left;
  }

  .candidate-card {
    min-height: 0;
  }
}

@media (max-width: 760px) {
  .page {
    padding: 20px 16px 34px;
  }

  .controls {
    grid-template-columns: 1fr;
  }

  .year-strip {
    display: none;
  }

  .year-select {
    display: block;
  }

  .source-stamp {
    text-align: left;
  }

  .candidate-top,
  .candidate-foot,
  .panel-header {
    align-items: flex-start;
    flex-direction: column;
  }

  .map-header-tools {
    justify-items: stretch;
    min-width: 100%;
  }

  .map-mode-tabs {
    width: 100%;
  }

  .map-mode-button {
    flex: 1;
  }

  .portrait-row {
    align-items: flex-start;
  }

  .portrait {
    width: 88px;
    height: 88px;
  }

  .candidate-bar-row {
    grid-template-columns: minmax(76px, 0.8fr) minmax(90px, 1fr) 48px;
  }
}
</style>
</head>

  <header class="masthead">
    <div>
      <p class="kicker">Politics dashboard</p>
      <h1>Presidential Election Atlas</h1>
    </div>
    <p class="deck">A state-by-state dashboard for U.S. presidential elections from 1976 through 2024, built from the local state returns and candidate portrait assets.</p>
  </header>

  <section class="controls" aria-label="Election year controls">
    <div class="small-label">Election year</div>
    <div id="yearStrip" class="year-strip"></div>

    <div id="sourceStamp" class="source-stamp">Local returns bundle</div>
  </section>

  <main id="dashboardRoot">
    <div class="loading">Loading election data</div>
  </main>
</div>
<div id="tooltip" class="tooltip"></div>

  ["MN", 6, 3], ["IA", 6, 4], ["KS", 6, 5], ["OK", 6, 6], ["TX", 6, 7],
  ["WI", 7, 3], ["IL", 7, 4], ["MO", 7, 5], ["AR", 7, 6], ["LA", 7, 7],
  ["MI", 8, 3], ["IN", 8, 4], ["KY", 8, 5], ["TN", 8, 6], ["MS", 8, 7],
  ["OH", 9, 4], ["WV", 9, 5], ["AL", 9, 7], ["GA", 9, 8],
  ["PA", 10, 4], ["VA", 10, 5], ["NC", 10, 6], ["SC", 10, 7], ["FL", 10, 9],
  ["NY", 11, 3], ["NJ", 11, 4], ["MD", 11, 5],
  ["VT", 12, 2], ["MA", 12, 3], ["CT", 12, 4], ["DE", 12, 5],
  ["NH", 13, 2], ["RI", 13, 4], ["DC", 13, 6],
  ["ME", 14, 1]
].map(([code, col, row]) => ({ code, col, row }));

const fmtVotes = d3.format(",");
const fmtPct = d3.format(".1%");
const fmtPts = v => `${Math.abs(v * 100).toFixed(1)} pts`;
const fmtSignedPts = v => `${v >= 0 ? "+" : "-"}${Math.abs(v * 100).toFixed(1)} pts`;
const root = d3.select("#dashboardRoot");
const tooltip = d3.select("#tooltip");

let elections = [];
let candidates = [];
let rows = [];
let years = [];
let selectedYear = 2024;
let selectedState = null;
let selectedMapMode = "state";
let candidateById = new Map();
let stateRowsByYear = new Map();
let resultCache = new Map();
let usStateFeatures = [];

Promise.all([
  d3.json("data/elections.json"),
  d3.json("data/candidates.json"),
  d3.csv("data/president_state_results_by_candidate.csv", d3.autoType),
  d3.json("data/sources.json"),
  d3.json("data/us-states-10m.json")
]).then(([electionData, candidateData, stateData, sources, usTopology]) => {
  elections = electionData;
  candidates = candidateData;
  rows = stateData;
  years = elections.map(d => d.year);
  selectedYear = years.includes(2024) ? 2024 : d3.max(years);
  candidateById = new Map(candidates.map(d => [d.candidateId, d]));
  stateRowsByYear = d3.group(rows, d => d.year, d => d.state_po);
  usStateFeatures = topojson.feature(usTopology, usTopology.objects.states).features
    .map(feature => {
      const code = FIPS_TO_STATE[String(feature.id).padStart(2, "0")];
      return code ? { ...feature, properties: { ...feature.properties, code } } : null;
    })
    .filter(Boolean);
  document.getElementById("sourceStamp").textContent = `Generated ${new Date(sources.generatedAt).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })}`;
  buildShell();
  buildYearControls();
  setYear(selectedYear);
  window.addEventListener("resize", debounce(() => render(), 120));
}).catch(error => {
  root.html(`<div class="loading">Unable to load dashboard data</div>`);
  console.error(error);
});

      <article id="resultCard" class="result-card"></article>

    <section class="dashboard-grid">

              <h2 class="panel-title">Battleground table</h2>
            </div>
          </div>
          <div id="battlegroundTable"></div>
        </article>
      </aside>
    </section>

    <section class="lower-grid">
      <article class="panel">

          <div>
            <p class="eyebrow">Shift</p>

          </div>
        </div>

        <p id="shiftNote" class="chart-note"></p>
      </article>
      <article class="panel">

          <div>
            <p class="eyebrow">National context</p>

        <div id="trendChart" class="chart-frame"></div>

      </article>
    </section>

    <section class="panel source-panel">
      <p><strong>Sources and caveat.</strong> Data comes from the local <code>case/state/dashboard_assets</code> bundle generated from <code>1976-2024-president.csv</code>: state-level presidential returns, candidate metadata, and Wikimedia/Wikidata portrait metadata. State boundaries use the local <code>us-atlas</code> state TopoJSON asset. The maps display statewide margins. Electoral-vote totals use standard state allocations and hard-coded Maine/Nebraska district splits for 2008, 2016, 2020, and 2024; the source vote table itself is state-level.</p>
    </section>
  `);
  d3.selectAll(".map-mode-button").on("click", event => {

    drawMap(getStateResults(selectedYear), getNationalSummary(selectedYear).evMap);

function buildYearControls() {
  const strip = d3.select("#yearStrip");
  strip.selectAll("button")
    .data(years)
    .join("button")
    .attr("class", d => `year-button ${winnerClassForYear(d)}`)
    .text(d => d)
    .on("click", (_, d) => setYear(d));

  const select = d3.select("#yearSelect");
  select.selectAll("option")
    .data(years)
    .join("option")
    .attr("value", d => d)
    .text(d => d);
  select.on("change", event => setYear(+event.target.value));
}

function setYear(year) {
  selectedYear = year;
  const results = getStateResults(year);
  selectedState = getClosestState(results)?.state_po || "PA";
  d3.selectAll(".year-button").classed("active", d => d === selectedYear);
  d3.select("#yearSelect").property("value", selectedYear);
  render();
}

function render() {
  const election = getElection(selectedYear);
  const national = getNationalSummary(selectedYear);
  const results = getStateResults(selectedYear);
  const selected = results.find(d => d.state_po === selectedState) || getClosestState(results);
  if (selected) selectedState = selected.state_po;

  renderCandidateCard("#demCard", national.dem, national.ev.DEMOCRAT, national.carried.DEMOCRAT);
  renderCandidateCard("#repCard", national.rep, national.ev.REPUBLICAN, national.carried.REPUBLICAN);
  renderResultCard(election, national);
  drawMap(results, national.evMap);
  renderStatePanel(selected);
  renderBattlegroundTable(results);
  drawShiftChart(selectedYear);
  drawTrendChart();
}

function renderCandidateCard(selector, candidate, ev, carried) {
  const party = partySpec(candidate.partySimplified);
  const meta = candidateById.get(candidate.candidateId);
  const imagePath = meta && meta.image ? meta.image.path : "";
  d3.select(selector)
    .attr("class", `candidate-card ${party.className}`)
    .html(`
      <div class="candidate-top">
        <h2 class="candidate-name">${candidate.displayName}</h2>
        <span class="party-pill">${party.label}</span>
      </div>
      <div class="portrait-row">
        <img class="portrait" src="${imagePath}" alt="${candidate.displayName}">
        <div class="candidate-metrics">
          <span><span class="metric-value">${ev}</span><span class="metric-caption">electoral votes</span></span>
          <span><span class="metric-value">${fmtPct(candidate.nationalVoteShare)}</span><span class="metric-caption">national popular vote</span></span>
        </div>
      </div>
      <div class="candidate-foot">
        <span>${fmtVotes(candidate.nationalVotes)} votes</span>
        <span>${carried} states/DC carried</span>
      </div>
    `);
}

function renderResultCard(election, national) {
  const evWinnerParty = national.ev.DEMOCRAT > national.ev.REPUBLICAN ? "DEMOCRAT" : "REPUBLICAN";
  const evWinner = national[evWinnerParty === "DEMOCRAT" ? "dem" : "rep"];
  const popularWinner = election.candidates.find(d => d.candidateId === election.popularVoteWinnerCandidateId);
  const popularText = popularWinner && popularWinner.candidateId !== evWinner.candidateId
    ? `${evWinner.displayName} wins the Electoral College; ${popularWinner.displayName} leads the popular vote.`
    : `${evWinner.displayName} wins the Electoral College and the national popular vote.`;
  const otherVotes = Math.max(0, election.nationalTotalVotes - national.dem.nationalVotes - national.rep.nationalVotes);
  const demPct = national.dem.nationalVotes / election.nationalTotalVotes;
  const repPct = national.rep.nationalVotes / election.nationalTotalVotes;
  const otherPct = otherVotes / election.nationalTotalVotes;
  const demEvPct = national.ev.DEMOCRAT / 538;
  const repEvPct = national.ev.REPUBLICAN / 538;
  const otherEv = Math.max(0, 538 - national.ev.DEMOCRAT - national.ev.REPUBLICAN);

  d3.select("#resultCard").html(`
    <div>
      <p class="kicker" style="text-align:center;margin-bottom:8px;">${selectedYear} election result</p>
      <h2 class="year-title">${popularText}</h2>
      <p class="headline">The dashboard starts with the national result, then breaks down where the map changed and which states sat closest to the two-party center.</p>
    </div>
    <div class="bars">
      <div>
        <div class="bar-label"><span>Electoral vote</span><span>270 needed to win</span></div>
        <div class="stack">
          <div class="seg dem" style="width:${demEvPct * 100}%"></div>
          <div class="seg other" style="width:${(otherEv / 538) * 100}%"></div>
          <div class="seg rep" style="width:${repEvPct * 100}%"></div>
          <span class="majority-marker" style="left:${(270 / 538) * 100}%"></span>
        </div>
      </div>
      <div>
        <div class="bar-label"><span>Popular vote</span><span>${fmtVotes(election.nationalTotalVotes)} total votes</span></div>
        <div class="stack">
          <div class="seg dem" style="width:${demPct * 100}%"></div>
          <div class="seg other" style="width:${otherPct * 100}%"></div>
          <div class="seg rep" style="width:${repPct * 100}%"></div>
          <span class="majority-marker" style="left:50%"></span>
        </div>
      </div>
    </div>
    <p class="method-note">Electoral-vote totals include district splits for Maine and Nebraska where applicable; the state map remains statewide.</p>
  `);
}

function drawMap(results, evMap) {
  updateMapModeControls();
  if (selectedMapMode === "hex" || !usStateFeatures.length) {
    drawHexMap(results, evMap);
  } else {
    drawStateMap(results, evMap);
  }
}

function drawStateMap(results, evMap) {
  const byState = new Map(results.map(d => [d.state_po, d]));
  const width = 720;
  const height = 455;
  const color = d3.scaleSequential(d3.interpolateRdBu).domain([-0.55, 0.55]).clamp(true);
  const features = usStateFeatures.map(feature => {
    const code = feature.properties.code;
    const result = byState.get(code);
    return {
      ...feature,
      code,
      ...result,
      ev: evMap[code] || 0
    };
  });
  const collection = { type: "FeatureCollection", features };
  const projection = d3.geoAlbersUsa().fitExtent([[8, 12], [width - 8, height - 14]], collection);
  const path = d3.geoPath(projection);
  const svg = d3.select("#mapWrap")
    .html("")
    .append("svg")
    .attr("viewBox", `0 0 ${width} ${height}`)
    .attr("role", "img")
    .attr("aria-label", `Geographic state map for the ${selectedYear} presidential election`);

  svg.append("g")
    .selectAll("path")
    .data(features)
    .join("path")
    .attr("class", "state-shape")
    .attr("d", path)
    .attr("fill", d => d.dMargin == null ? "#d7d0c3" : color(d.dMargin))
    .attr("stroke", d => d.code === selectedState ? "#20242a" : "#fffdf8")
    .attr("stroke-width", d => d.code === selectedState ? 2.4 : 1)
    .attr("stroke-linejoin", "round")
    .on("click", (_, d) => {
      selectedState = d.code;
      render();
    })
    .on("mouseenter", (event, d) => showTooltip(event, stateTooltip(d)))
    .on("mousemove", event => moveTooltip(event))
    .on("mouseleave", hideTooltip);

  svg.append("g")
    .selectAll("text")
    .data(features.filter(d => Number.isFinite(path.centroid(d)[0]) && Number.isFinite(path.centroid(d)[1])))
    .join("text")
    .attr("class", "state-label")
    .attr("x", d => {
      const [x] = path.centroid(d);
      return x + (LABEL_OFFSETS[d.code]?.[0] || 0);
    })
    .attr("y", d => {
      const [, y] = path.centroid(d);
      return y + (LABEL_OFFSETS[d.code]?.[1] || 0);
    })
    .attr("fill", d => textColor(d.dMargin))
    .text(d => d.code);
}

function drawHexMap(results, evMap) {
  const byState = new Map(results.map(d => [d.state_po, d]));
  const width = 720;
  const height = 440;
  const radius = 23;
  const svg = d3.select("#mapWrap")
    .html("")
    .append("svg")
    .attr("viewBox", `0 0 ${width} ${height}`)
    .attr("role", "img")
    .attr("aria-label", `State hex map for the ${selectedYear} presidential election`);

  const g = svg.append("g").attr("transform", "translate(28,18)");
  const hexPath = hexagonPath(radius);
  const color = d3.scaleSequential(d3.interpolateRdBu).domain([-0.55, 0.55]).clamp(true);

  const states = HEX_LAYOUT.map(d => {
    const result = byState.get(d.code);
    return {
      ...d,
      ...result,
      ev: evMap[d.code] || 0,
      x: d.col * 44 + (d.row % 2 ? 22 : 0),
      y: d.row * 38
    };
  });

  const node = g.selectAll(".state-node")
    .data(states)
    .join("g")
    .attr("class", "state-node")
    .attr("transform", d => `translate(${d.x},${d.y})`)
    .on("click", (_, d) => {
      selectedState = d.code;
      render();
    })
    .on("mouseenter", (event, d) => showTooltip(event, stateTooltip(d)))
    .on("mousemove", event => moveTooltip(event))
    .on("mouseleave", hideTooltip);

  node.append("path")
    .attr("class", "hex")
    .attr("d", hexPath)
    .attr("fill", d => d.dMargin == null ? "#d7d0c3" : color(d.dMargin))
    .attr("stroke", d => d.code === selectedState ? "#20242a" : "#fffdf8")
    .attr("stroke-width", d => d.code === selectedState ? 3 : 2.2);

  node.append("text")
    .attr("class", "hex-label")
    .attr("y", -2)
    .attr("fill", d => textColor(d.dMargin))
    .text(d => d.code);

  node.append("text")
    .attr("class", "hex-ev")
    .attr("y", 12)
    .attr("fill", d => textColor(d.dMargin))
    .text(d => d.ev);
}

function updateMapModeControls() {
  d3.selectAll(".map-mode-button")
    .classed("active", function() {
      return this.dataset.mapMode === selectedMapMode;
    });
}

function renderStatePanel(state) {
  if (!state) return;
  const rows = state.rows
    .slice()
    .sort((a, b) => d3.descending(a.candidatevotes, b.candidatevotes))
    .slice(0, 4);
  const marginParty = state.dMargin >= 0 ? "D" : "R";
  const margin = `${marginParty} +${fmtPts(state.dMargin)}`;
  d3.select("#statePanel").html(`
    <div>
      <p class="eyebrow">Selected state</p>
      <h2 class="state-name">${titleCase(state.state)} (${state.state_po})</h2>
      <div class="state-meta">${state.winner.candidate_display} carried the statewide vote by ${fmtPts(state.margin)}. Two-party margin: ${margin}.</div>
    </div>
    <div class="candidate-bars">
      ${rows.map(row => {
        const p = partySpec(row.party_simplified);
        return `
          <div class="candidate-bar-row">
            <span class="candidate-bar-name">${row.candidate_display}</span>
            <span class="candidate-bar-track"><span class="candidate-bar-fill" style="width:${row.vote_share * 100}%;background:${p.color}"></span></span>
            <span>${fmtPct(row.vote_share)}</span>
          </div>
        `;
      }).join("")}
    </div>
    <div class="state-meta">${fmtVotes(state.totalVotes)} ballots in the state-level return.</div>
  `);
}

function renderBattlegroundTable(results) {
  const rows = results
    .filter(d => d.dMargin != null)
    .slice()
    .sort((a, b) => d3.ascending(Math.abs(a.dMargin), Math.abs(b.dMargin)))
    .slice(0, 9);
  d3.select("#battlegroundTable").html(`
    <table class="battleground-table">
      <thead><tr><th>State</th><th>Winner</th><th>Margin</th></tr></thead>
      <tbody>
        ${rows.map(d => `
          <tr>
            <td>${d.state_po}</td>
            <td>${d.winner.candidate_display}</td>
            <td>${d.dMargin >= 0 ? "D" : "R"} +${fmtPts(d.dMargin)}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `);
}

function drawShiftChart(year) {
  const container = d3.select("#shiftChart").html("");
  const prevYear = years[years.indexOf(year) - 1];
  if (!prevYear) {
    d3.select("#shiftNote").text("1976 is the first election in the local dashboard bundle, so no prior-election shift is computed.");
    return;
  }
  d3.select("#shiftNote").text(`Each line moves from the ${prevYear} D-R state margin to the ${year} D-R state margin. Positive swing moves toward Democrats; negative swing moves toward Republicans.`);

  const current = new Map(getStateResults(year).map(d => [d.state_po, d]));
  const previous = new Map(getStateResults(prevYear).map(d => [d.state_po, d]));
  const swings = Array.from(current.values())
    .map(d => {
      const prev = previous.get(d.state_po);
      if (!prev || d.dMargin == null || prev.dMargin == null) return null;
      return { ...d, prevMargin: prev.dMargin, swing: d.dMargin - prev.dMargin };
    })
    .filter(Boolean)
    .sort((a, b) => d3.descending(Math.abs(a.swing), Math.abs(b.swing)))
    .slice(0, 14);

  const bounds = container.node().getBoundingClientRect();
  const width = Math.max(360, bounds.width || 620);
  const height = 285;
  const margin = { top: 12, right: 58, bottom: 34, left: 44 };
  const svg = container.append("svg").attr("viewBox", `0 0 ${width} ${height}`);
  const x = d3.scaleLinear().domain([-0.6, 0.6]).range([margin.left, width - margin.right]);
  const y = d3.scaleBand().domain(swings.map(d => d.state_po)).range([margin.top, height - margin.bottom]).padding(0.36);

  svg.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(0,${height - margin.bottom})`)
    .call(d3.axisBottom(x).tickValues([-0.4, -0.2, 0, 0.2, 0.4]).tickFormat(d => `${d > 0 ? "D +" : d < 0 ? "R +" : ""}${Math.abs(d * 100).toFixed(0)}`));

  svg.append("line")
    .attr("x1", x(0))
    .attr("x2", x(0))
    .attr("y1", margin.top)
    .attr("y2", height - margin.bottom)
    .attr("stroke", "#8b8174")
    .attr("stroke-dasharray", "3,3");

  svg.append("g")
    .selectAll("text")
    .data(swings)
    .join("text")
    .attr("x", margin.left - 9)
    .attr("y", d => y(d.state_po) + y.bandwidth() / 2 + 4)
    .attr("text-anchor", "end")
    .attr("fill", "#676f78")
    .attr("font-size", 11)
    .attr("font-weight", 700)
    .text(d => d.state_po);

  const row = svg.append("g")
    .selectAll("g")
    .data(swings)
    .join("g");

  row.append("line")
    .attr("x1", d => x(d.prevMargin))
    .attr("x2", d => x(d.dMargin))
    .attr("y1", d => y(d.state_po) + y.bandwidth() / 2)
    .attr("y2", d => y(d.state_po) + y.bandwidth() / 2)
    .attr("stroke", d => d.swing >= 0 ? PARTY.DEMOCRAT.color : PARTY.REPUBLICAN.color)
    .attr("stroke-width", 4)
    .attr("stroke-linecap", "round")
    .attr("opacity", 0.78);

  row.append("circle")
    .attr("cx", d => x(d.prevMargin))
    .attr("cy", d => y(d.state_po) + y.bandwidth() / 2)
    .attr("r", 3.5)
    .attr("fill", "#f6f3ec")
    .attr("stroke", "#676f78");

  row.append("circle")
    .attr("cx", d => x(d.dMargin))
    .attr("cy", d => y(d.state_po) + y.bandwidth() / 2)
    .attr("r", 5)
    .attr("fill", d => d.swing >= 0 ? PARTY.DEMOCRAT.color : PARTY.REPUBLICAN.color);

  row.append("text")
    .attr("x", width - margin.right + 10)
    .attr("y", d => y(d.state_po) + y.bandwidth() / 2 + 4)
    .attr("fill", d => d.swing >= 0 ? PARTY.DEMOCRAT.dark : PARTY.REPUBLICAN.dark)
    .attr("font-size", 11)
    .attr("font-weight", 700)
    .text(d => fmtSignedPts(d.swing));
}

function drawTrendChart() {
  const container = d3.select("#trendChart").html("");
  const trend = years.map(year => {
    const n = getNationalSummary(year);
    return { year, margin: n.dem.nationalVoteShare - n.rep.nationalVoteShare };
  });
  const bounds = container.node().getBoundingClientRect();
  const width = Math.max(360, bounds.width || 620);
  const height = 285;
  const margin = { top: 18, right: 24, bottom: 34, left: 46 };
  const svg = container.append("svg").attr("viewBox", `0 0 ${width} ${height}`);
  const x = d3.scalePoint().domain(years).range([margin.left, width - margin.right]).padding(0.5);
  const extent = d3.extent(trend, d => d.margin);
  const yMax = Math.max(Math.abs(extent[0]), Math.abs(extent[1]), 0.12) + 0.02;
  const y = d3.scaleLinear().domain([-yMax, yMax]).range([height - margin.bottom, margin.top]);
  const line = d3.line().x(d => x(d.year)).y(d => y(d.margin)).curve(d3.curveMonotoneX);

  svg.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(0,${height - margin.bottom})`)
    .call(d3.axisBottom(x).tickValues(years.filter((_, i) => i % 2 === 0)));

  svg.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(${margin.left},0)`)
    .call(d3.axisLeft(y).ticks(5).tickFormat(d => `${d > 0 ? "D +" : d < 0 ? "R +" : ""}${Math.abs(d * 100).toFixed(0)}`));

  svg.append("line")
    .attr("x1", margin.left)
    .attr("x2", width - margin.right)
    .attr("y1", y(0))
    .attr("y2", y(0))
    .attr("stroke", "#8b8174")
    .attr("stroke-dasharray", "3,3");

  svg.append("path")
    .datum(trend)
    .attr("fill", "none")
    .attr("stroke", "#287d67")
    .attr("stroke-width", 3)
    .attr("d", line);

  svg.append("g")
    .selectAll("circle")
    .data(trend)
    .join("circle")
    .attr("cx", d => x(d.year))
    .attr("cy", d => y(d.margin))
    .attr("r", d => d.year === selectedYear ? 7 : 4)
    .attr("fill", d => d.margin >= 0 ? PARTY.DEMOCRAT.color : PARTY.REPUBLICAN.color)
    .attr("stroke", d => d.year === selectedYear ? "#20242a" : "#fffdf8")
    .attr("stroke-width", d => d.year === selectedYear ? 2 : 1.5)
    .on("mouseenter", (event, d) => showTooltip(event, `<strong>${d.year}</strong>National D-R margin: ${d.margin >= 0 ? "D" : "R"} +${fmtPts(d.margin)}`))
    .on("mousemove", event => moveTooltip(event))
    .on("mouseleave", hideTooltip);
}

function getElection(year) {
  return elections.find(d => d.year === year);
}

function getNationalSummary(year) {
  const election = getElection(year);
  const demId = election.majorPartyCandidateIds.DEMOCRAT;
  const repId = election.majorPartyCandidateIds.REPUBLICAN;
  const dem = election.candidates.find(d => d.candidateId === demId);
  const rep = election.candidates.find(d => d.candidateId === repId);
  const results = getStateResults(year);
  const evMap = evMapForYear(year);
  const ev = { DEMOCRAT: 0, REPUBLICAN: 0, OTHER: 0 };
  const carried = { DEMOCRAT: 0, REPUBLICAN: 0, OTHER: 0 };

  results.forEach(result => {
    const party = result.winner.party_simplified === "DEMOCRAT" || result.winner.party_simplified === "REPUBLICAN"
      ? result.winner.party_simplified
      : "OTHER";
    carried[party] += 1;
    const split = SPLIT_EV[year] && SPLIT_EV[year][result.state_po];
    if (split) {
      ev.DEMOCRAT += split.DEMOCRAT || 0;
      ev.REPUBLICAN += split.REPUBLICAN || 0;
      ev.OTHER += split.OTHER || 0;
    } else {
      ev[party] += evMap[result.state_po] || 0;
    }
  });

  return { dem, rep, ev, evMap, carried };
}

function getStateResults(year) {
  if (resultCache.has(year)) return resultCache.get(year);
  const groups = stateRowsByYear.get(year);
  const results = Array.from(groups.entries()).map(([state_po, stateRows]) => {
    const sorted = stateRows.slice().sort((a, b) => d3.descending(a.candidatevotes, b.candidatevotes));
    const winner = sorted[0];
    const runner = sorted[1];
    const dem = stateRows.find(d => d.party_simplified === "DEMOCRAT");
    const rep = stateRows.find(d => d.party_simplified === "REPUBLICAN");
    const dMargin = dem && rep ? dem.vote_share - rep.vote_share : null;
    return {
      year,
      state_po,
      state: winner.state,
      rows: stateRows,
      winner,
      runner,
      totalVotes: winner.totalvotes,
      margin: winner.vote_share - (runner ? runner.vote_share : 0),
      dMargin
    };
  }).sort((a, b) => d3.ascending(a.state_po, b.state_po));
  resultCache.set(year, results);
  return results;
}

function getClosestState(results) {
  return results
    .filter(d => d.dMargin != null)
    .slice()
    .sort((a, b) => d3.ascending(Math.abs(a.dMargin), Math.abs(b.dMargin)))[0];
}

function evMapForYear(year) {
  if (year <= 1980) return EV_1970;
  if (year <= 1988) return EV_1980;
  if (year <= 2000) return EV_1990;
  if (year <= 2008) return EV_2000;
  if (year <= 2020) return EV_2010;
  return EV_2020;
}

function winnerClassForYear(year) {
  const n = getNationalSummary(year);
  if (n.ev.DEMOCRAT > n.ev.REPUBLICAN) return "dem";
  if (n.ev.REPUBLICAN > n.ev.DEMOCRAT) return "rep";
  return "other";
}

function partySpec(party) {
  return PARTY[party] || PARTY.OTHER;
}

function hexagonPath(r) {
  return d3.range(6).map(i => {
    const angle = Math.PI / 180 * (60 * i + 30);
    const x = Math.cos(angle) * r;
    const y = Math.sin(angle) * r;
    return `${i ? "L" : "M"}${x.toFixed(2)},${y.toFixed(2)}`;
  }).join("") + "Z";
}

function textColor(margin) {
  return margin != null && Math.abs(margin) > 0.22 ? "#fffdf8" : "#20242a";
}

function stateTooltip(d) {
  if (!d.winner) return `<strong>${d.code}</strong>No state result loaded.`;
  return `<strong>${titleCase(d.state)} (${d.state_po})</strong>${d.winner.candidate_display} ${fmtPct(d.winner.vote_share)}<br>Two-party margin: ${d.dMargin >= 0 ? "D" : "R"} +${fmtPts(d.dMargin)}<br>Electoral votes: ${d.ev}`;
}

function showTooltip(event, html) {
  tooltip.html(html).style("opacity", 1);
  moveTooltip(event);
}

function moveTooltip(event) {
  tooltip.style("transform", `translate(${event.clientX + 14}px, ${event.clientY + 14}px)`);
}

function hideTooltip() {
  tooltip.style("opacity", 0).style("transform", "translate(-999px, -999px)");
}

function titleCase(value) {
  return String(value || "").toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

function debounce(fn, wait) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), wait);
  };
}
</script>
</body>
